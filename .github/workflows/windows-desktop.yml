name: Windows 桌面版
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: 啟動 portable EXE、驗證資產與存檔、擷取畫面
        run: node desktop/smoke.mjs desktop/dist/release/FutureLifeMarch.exe desktop/dist/screenshots
      - name: 記錄 EXE 大小
        run: |
          $exe = Get-Item desktop/dist/release/FutureLifeMarch.exe
          "$($exe.Name) — $($exe.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: FutureLifeMarch-windows-x64
          path: desktop/dist/release/FutureLifeMarch.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-screenshots
          path: desktop/dist/screenshots/*.png

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FutureLifeMarch-windows-x64
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view desktop-latest; then
            gh release create desktop-latest --target "$GITHUB_SHA" --title "未來人生・進行曲 · Windows" --latest=false
          fi
          gh release upload desktop-latest FutureLifeMarch.exe --clobber
